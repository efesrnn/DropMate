# DropMate — Dart kodu için statik analiz ve lint ayarları.
# Detaylar: https://dart.dev/tools/analysis
#
# Bu dosyada tanımlanan lint kuralları VS Code / Android Studio
# tarafından kod yazarken anlık olarak gösterilir; ayrıca komut
# satırından `flutter analyze` ile de çalıştırılabilir.

# Flutter ekibinin önerdiği temel lint setini dahil ediyoruz.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Mümkün her yerde const constructor kullan — performans ve
    # widget rebuild optimizasyonu için kritik.
    prefer_const_constructors: true
    # Liste/Map/Set literal'larında da const tercih et.
    prefer_const_literals_to_create_immutables: true
    # Lokal değişkenlerde immutability için `final` kullan.
    prefer_final_locals: true
