name: dropmate
description: "DropMate — peer-to-peer teslimat uygulaması. Mini Katalog modülü."
# Pub.dev'e yanlışlıkla yayınlanmasın diye:
publish_to: 'none'

# Sürüm formatı: <major>.<minor>.<patch>+<build_number>
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # iOS tarzı ikonlar (Flutter scaffold tarafından default olarak eklendi)
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Önerilen lint kuralları seti
  flutter_lints: ^6.0.0

# Flutter'a özel yapılandırma
flutter:
  # Material Design ikon fontunu uygulamaya dahil et
  uses-material-design: true

  # Ürün görselleri için asset klasörü.
  # Şimdilik placeholder olarak boş — ürün görselleri Image.network ile
  # https://picsum.photos üzerinden çekilecek.
  assets:
    - assets/images/
